sonar.projectKey=portfolio-v2
sonar.projectName=Josmary Portfolio
sonar.language=ts

# Fuentes y tests
sonar.sources=src/
sonar.tests=tests/

# Excluir del análisis COMPLETO
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/coverage/**,\
  **/dist/**,\
  **/build/**,\
  src/types/**

# Excluir SOLO del análisis de duplicación
sonar.cpd.exclusions=\
  **/tests/**/*,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/__tests__/**/*

# Incluir tests para análisis (pero no para duplicación)
sonar.test.inclusions=\
  **/tests/**/*.test.ts,\
  **/tests/**/*.test.tsx,\
  **/__tests__/**/*

# Excluir tests + middleware + app del coverage
sonar.coverage.exclusions=\
  **/tests/**/*,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/playwright-report/**/*,\
  **/test-results/**/*,\
  src/middleware.ts,\
  src/app/**,\
  src/lib/db/migrations/**

sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
